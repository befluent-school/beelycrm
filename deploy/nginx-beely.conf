# ============================================================
# Be Fluent — Nginx do Beely CRM.
# Copie para /etc/nginx/sites-available/beely, symlink em
# sites-enabled, teste com `nginx -t` e recarregue.
# Certbot adiciona o bloco 443/HTTPS automaticamente depois.
# ============================================================

# Limite de taxa específico para as rotas de autenticação —
# defesa em profundidade contra força bruta, além da proteção
# já embutida no login (comparação de senha em tempo constante).
limit_req_zone $binary_remote_addr zone=beely_auth:10m rate=10r/m;

# Webhooks (Z-API, Vapi, Stripe, Asaas) recebem tráfego de
# terceiros — limite mais generoso que auth, mas ainda limitado
# para não virar vetor de DoS.
limit_req_zone $binary_remote_addr zone=beely_webhooks:10m rate=60r/m;

server {
    listen 80;
    server_name crm.befluentschool.com.br;

    include snippets/seguranca.conf;

    location ~ ^/(login|signup|auth/google)$ {
        limit_req zone=beely_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3200;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/api/webhooks/ {
        limit_req zone=beely_webhooks burst=20 nodelay;
        proxy_pass http://127.0.0.1:3200;
        include /etc/nginx/proxy_params;
    }

    # /api/debug/* e /api/cron/* nunca devem ser alcançáveis de
    # fora — a aplicação já os protege com DEBUG_ADMIN_SECRET/
    # CRON_SECRET (src/lib/debug-gate.ts, src/lib/cron-gate.ts),
    # mas negar aqui também evita até a tentativa de brute-force
    # desses segredos chegar ao processo Node.
    location ~ ^/api/(debug|cron)/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3200;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
